name: Design Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  design-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/design-audit.mjs --check
