# Stage 2 data-integrity tests — PR only, never deploys.
#
# Triggers on ALL pull requests targeting main (no paths filter). This is
# deliberate: GitHub branch protection "required status checks" will block
# a PR forever if the workflow never runs (e.g. a docs-only PR with a paths
# filter). Instead, the workflow always runs; a change-detection job skips
# the heavy emulator tests for docs-only PRs. A skipped required check
# satisfies branch protection (per GitHub docs on required status checks).
#
# Safety properties:
# - No GCP credentials, no service account, no workload identity.
# - No access to production Firestore (emulator only, localhost).
# - No build, no push, no deploy steps exist in this workflow.
# - Cannot deploy even if misconfigured: there is no deploy job.
name: Stage 2 Data-Integrity Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read   # read-only; no write, no id-token, no GCP auth

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.check.outputs.code_changed }}
    steps:
      - name: Checkout PR branch (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: check
        run: |
          # On a pull_request event, HEAD is GitHub's synthetic merge commit
          # (base merged with the PR head). HEAD^1 is the base branch tip, so
          # this diff is exactly the PR's changes — deterministic, no need to
          # compute a merge base. --no-renames ensures a source file renamed
          # into docs/ still shows as a deletion (code change, not docs-only).
          # Docs-only = files under docs/ or ending in .md.
          # Anything else (code, tests, workflows, config) triggers the full suite.
          CHANGED=$(git diff --name-only --no-renames HEAD^1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qvE '^docs/|\.md$'; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "Code changes detected — running full test suite."
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only changes — skipping emulator tests (check will report skipped)."
          fi

  emulator-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java (Firestore emulator requires Java 21+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Start Firestore emulator
        run: |
          npm install -g firebase-tools
          # Single-project emulator config; no production project ID used
          cat > firebase.json <<'EOF'
          {
            "emulators": {
              "firestore": { "port": 8080 },
              "ui": { "enabled": false }
            }
          }
          EOF
          firebase emulators:start --only firestore --project demo-test > /tmp/emulator.log 2>&1 &
          echo $! > /tmp/emulator.pid
          # Wait for emulator to accept connections (max 60s).
          # FAIL THE WORKFLOW if the emulator doesn't start — never silently skip.
          READY=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/ > /dev/null 2>&1; then
              echo "Emulator ready after ${i}s"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "::error::Firestore emulator failed to start within 60s. Emulator log:"
            cat /tmp/emulator.log
            exit 1
          fi

      - name: Verify emulator is serving Firestore (not a stale process)
        run: |
          # The emulator REST API should respond to a document read.
          # If this fails, something else is on port 8080 — fail, don't test against it.
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080/v1/projects/demo-test/databases/(default)/documents/app-state/main" || echo "000")
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "404" ]; then
            echo "::error::Port 8080 did not return a valid Firestore response (got HTTP $HTTP_CODE). Refusing to test against an unknown service."
            exit 1
          fi
          echo "Emulator Firestore API responding (HTTP $HTTP_CODE)."

      - name: Run Stage 2 tests against real emulator
        env:
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'
          FIRESTORE_ENABLED: 'true'
          FIREBASE_PROJECT_ID: 'demo-test'
          FIRESTORE_DATABASE_ID: ''
          # FIRESTORE_MOCK is NOT set — harness uses the real emulator
          # when FIRESTORE_EMULATOR_HOST is present.
        run: |
          npm run test:stage2 2>&1 | tee /tmp/test-output.log
          TEST_EXIT=${PIPESTATUS[0]}
          # FAIL if tests fell back to the mock — the whole point is testing
          # against the real emulator. The harness prints the mode on startup.
          if grep -q "in-memory mock" /tmp/test-output.log; then
            echo "::error::Tests ran against the in-memory mock, not the real emulator. This defeats the purpose of CI verification."
            exit 1
          fi
          if ! grep -q "REAL Firestore emulator" /tmp/test-output.log; then
            echo "::error::Could not confirm tests ran against the real emulator."
            exit 1
          fi
          echo "Confirmed: tests ran against the REAL Firestore emulator."
          exit $TEST_EXIT

      - name: Run Part 2 unit tests (no emulator needed)
        run: node tests/part2/run-all.mjs

      - name: Run Stage 3A media unit tests (no emulator needed)
        run: node tests/stage3a/run-all.mjs

      - name: Run Stage 3C unit tests (no emulator needed)
        run: node tests/stage3c/run-all.mjs

      - name: Run Stage 4 unit tests (no emulator needed)
        run: node tests/stage4/run-all.mjs

      - name: Check for server crashes in test output
        if: always()
        run: |
          # The test suite itself is the crash detection: if the server crashes,
          # tests fail. This step only catches catastrophic issues that don't
          # surface as test failures (e.g., the server dying mid-suite).
          # We check for Node.js fatal errors, excluding EADDRINUSE which can
          # occur transiently during controlled test restarts (test 5, 10)
          # and is handled by the harness.
          if grep -qi "FATAL\|JavaScript heap out of memory\|Segmentation fault" /tmp/test-output.log; then
            echo "::error::Fatal server error detected in test output."
            grep -i "FATAL\|heap out of memory\|Segmentation fault" /tmp/test-output.log | head -20
            exit 1
          fi
          echo "No fatal server errors detected."

      - name: Stop emulator
        if: always()
        run: kill $(cat /tmp/emulator.pid) 2>/dev/null || true
