# Auto-deploy: every push to main builds and publishes the app to Cloud Run.
# No clicks needed — push is the deploy.
name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for keyless (Workload Identity Federation) login
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1080260390009/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@gen-lang-client-0875538181.iam.gserviceaccount.com'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy workers-collaborative-dashboard \
            --source . \
            --region us-east1 \
            --project gen-lang-client-0875538181 \
            --allow-unauthenticated \
            --set-env-vars NODE_ENV=production
