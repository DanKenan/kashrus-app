# Auto-deploy: every push to main builds a container with buildpacks
# and deploys it to Cloud Run. No clicks needed — push is the deploy.
name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for keyless (Workload Identity Federation) login
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1080260390009/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@gen-lang-client-0875538181.iam.gserviceaccount.com'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy
        run: |
          set -e
          PROJECT=gen-lang-client-0875538181
          REGION=us-east1
          REPO=cloud-run-source-deploy
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/$REPO/kashrus-app:${GITHUB_SHA}"
          # make sure the Artifact Registry repo exists (idempotent)
          gcloud artifacts repositories describe "$REPO" --location="$REGION" --project="$PROJECT" >/dev/null 2>&1 || \
            gcloud artifacts repositories create "$REPO" --repository-format=docker --location="$REGION" --project="$PROJECT" --description="Built containers for Cloud Run deploys"
          # build with buildpacks, push to Artifact Registry (async: we poll status ourselves)
          BUILD_ID=$(gcloud builds submit --async --pack "image=${IMAGE}" --project="$PROJECT" --format='value(id)' .)
          echo "build id: $BUILD_ID"
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project="$PROJECT" --format='value(status)')
            echo "build status: $STATUS"
            case "$STATUS" in
              SUCCESS) break ;;
              FAILURE|TIMEOUT|CANCELLED|EXPIRED) echo "build failed: $STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          # deploy the built image (avoids the --source annotation path)
          # First remove the stale AI Studio "sources" annotation — the API rejects
          # any update while it exists (its sources aren't referenced by containers).
          SVC="projects/gen-lang-client-0875538181/locations/us-east1/services/workers-collaborative-dashboard"
          TOKEN="$(gcloud auth print-access-token)"
          ANN=$(curl -s -H "Authorization: Bearer ${TOKEN}" "https://run.googleapis.com/v2/${SVC}" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          a=d.get('template',{}).get('metadata',{}).get('annotations',{})
          a.pop('run.googleapis.com/sources',None)
          print(json.dumps({'template':{'metadata':{'annotations':a}}}))")
          curl -s -X PATCH "https://run.googleapis.com/v2/${SVC}?updateMask=template.metadata.annotations" \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
            -d "$ANN" -o /dev/null -w "clear-annotation HTTP:%{http_code}\n"
          gcloud run deploy workers-collaborative-dashboard \
            --image="$IMAGE" \
            --region="$REGION" \
            --project="$PROJECT" \
            --allow-unauthenticated \
            --set-env-vars=NODE_ENV=production
