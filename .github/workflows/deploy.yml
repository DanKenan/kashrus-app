# Auto-deploy: every push to main builds a container with buildpacks
# and deploys it to Cloud Run. No clicks needed — push is the deploy.
name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for keyless (Workload Identity Federation) login
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1080260390009/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@gen-lang-client-0875538181.iam.gserviceaccount.com'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy
        env:
          # Staged (zero-traffic) deploys are the default: the new revision is
          # created with 0% traffic and the operator cuts over explicitly
          # (see CUTOVER.md). Set the repo Actions variable STAGED_DEPLOY to
          # 'false' to restore ordinary push-to-deploy behavior.
          STAGED_DEPLOY: ${{ vars.STAGED_DEPLOY }}
        run: |
          set -e
          PROJECT=gen-lang-client-0875538181
          REGION=us-east1
          REPO=cloud-run-source-deploy
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/$REPO/kashrus-app:${GITHUB_SHA}"
          # make sure the Artifact Registry repo exists (idempotent)
          gcloud artifacts repositories describe "$REPO" --location="$REGION" --project="$PROJECT" >/dev/null 2>&1 || \
            gcloud artifacts repositories create "$REPO" --repository-format=docker --location="$REGION" --project="$PROJECT" --description="Built containers for Cloud Run deploys"
          # Carry over the live frontend config so the new bundle behaves identically
          # (VITE_ vars are baked in at build time). Values never leave the runner.
          VITE_ENVS=$(gcloud run services describe workers-collaborative-dashboard --region="$REGION" --project="$PROJECT" --format=json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          envs={e['name']:e.get('value','') for e in d['spec']['template']['spec']['containers'][0].get('env',[]) if e['name'].startswith('VITE_')}
          print(','.join(f'env={k}={v}' for k,v in envs.items()))")
          PACK_ARGS="image=${IMAGE}"
          [ -n "$VITE_ENVS" ] && PACK_ARGS="${PACK_ARGS},${VITE_ENVS}"
          # build with buildpacks, push to Artifact Registry (async: we poll status ourselves)
          BUILD_ID=$(gcloud builds submit --async --pack "$PACK_ARGS" --project="$PROJECT" --format='value(id)' .)
          echo "build id: $BUILD_ID"
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project="$PROJECT" --format='value(status)')
            echo "build status: $STATUS"
            case "$STATUS" in
              SUCCESS) break ;;
              FAILURE|TIMEOUT|CANCELLED|EXPIRED) echo "build failed: $STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          # Deploy by replacing the service spec: this drops the stale AI Studio
          # "run.googleapis.com/sources" annotation that blocks all updates,
          # points at the new image, and ensures production mode — while
          # preserving every other existing setting.
          SVC_JSON=/tmp/svc.json
          gcloud run services describe workers-collaborative-dashboard \
            --region="$REGION" --project="$PROJECT" --format=json > "$SVC_JSON"
          IMAGE="$IMAGE" python3 - "$SVC_JSON" <<'EOF'
          import json, os, sys
          p = sys.argv[1]
          d = json.load(open(p))
          # Capture the currently-serving revision BEFORE dropping status
          # (replace takes the spec, not observed status).
          status = d.get('status') or {}
          latest_ready = status.get('latestReadyRevisionName')
          d.pop('status', None)
          tpl = d['spec']['template']
          anns = tpl['metadata'].get('annotations', {})
          anns.pop('run.googleapis.com/sources', None)
          # CORE FIX: Lock to a single instance. The app uses in-memory state
          # with Firestore persistence — multiple instances diverge and corrupt
          # data. Single instance eliminates the entire class of bugs.
          anns['autoscaling.knative.dev/maxScale'] = '1'
          tpl['metadata']['annotations'] = anns
          c = tpl['spec']['containers'][0]
          c['image'] = os.environ['IMAGE']
          env = c.get('env', [])
          # Strip cutover lock vars: they must never persist on a live revision.
          env = [e for e in env if e['name'] not in ('STAGED_REVISION', 'MAINTENANCE_MODE')]
          if not any(e['name'] == 'NODE_ENV' for e in env):
              env.append({'name': 'NODE_ENV', 'value': 'production'})
          c['env'] = env
          # STAGE 2 MIGRATION — staged (zero-traffic) deploy. Unless STAGED_DEPLOY
          # is explicitly 'false', pin 100% of traffic to the revision that is
          # currently serving it, so the revision created by `services replace`
          # below starts with ZERO traffic. The operator then verifies the new
          # revision on its direct URL and cuts traffic over explicitly
          # (see CUTOVER.md). This guarantees old unversioned writers and new
          # transactional writers never serve simultaneously — an ordinary
          # rolling deploy cannot promise that.
          #
          # ROUND 5 hardening:
          # - The workflow REFUSES to proceed if it cannot identify the
          #   currently-serving revision. A silent fallthrough to
          #   "traffic follows latest" could route production traffic to the
          #   new revision mid-migration. (Override for a true first deploy
          #   with STAGED_DEPLOY=first.)
          # - The staged revision gets STAGED_REVISION=true: the server
          #   serves reads/health but refuses ALL writes (503 NOT_YET_LIVE)
          #   until the operator flips it live during cutover. Even if the
          #   staged revision's direct URL is hit early, it cannot write.
          staged = os.environ.get('STAGED_DEPLOY', '')
          if staged != 'false':
              serving_rev = None
              for t in d['spec'].get('traffic', []) or []:
                  if (t.get('percent') or 0) > 0 and t.get('revisionName'):
                      serving_rev = t['revisionName']
                      break
              if not serving_rev:
                  # Default Cloud Run shape is {latestRevision: true} with no
                  # named revision — the serving revision is the latest ready one.
                  serving_rev = latest_ready
              if not serving_rev:
                  if staged == 'first':
                      print('STAGED_DEPLOY=first: no serving revision (first deploy) — '
                            'traffic follows latest revision')
                  else:
                      print('::error::STAGED DEPLOY REFUSED: cannot identify the '
                            'currently-serving revision (no traffic entry with '
                            'percent>0 and no latestReadyRevisionName). Refusing '
                            'to deploy rather than risk production traffic '
                            'following the new revision. If this is a true '
                            'first deploy, set STAGED_DEPLOY=first.',
                            file=sys.stderr)
                      sys.exit(1)
              else:
                  d['spec']['traffic'] = [
                      {'revisionName': serving_rev, 'percent': 100,
                       'latestRevision': False}
                  ]
                  print('STAGED DEPLOY: new revision gets 0% traffic; '
                        f'pinned to {serving_rev}')
              # Mark the new revision staged: reads + health OK, writes refused.
              # The cutover removes this env var (creating the live revision).
              if serving_rev or staged == 'first':
                  envs = c.get('env', [])
                  envs = [e for e in envs if e['name'] != 'STAGED_REVISION']
                  envs.append({'name': 'STAGED_REVISION', 'value': 'true'})
                  c['env'] = envs
                  print('STAGED DEPLOY: STAGED_REVISION=true set — new revision '
                        'cannot write until cutover')
          else:
              print('STAGED_DEPLOY=false: ordinary deploy, new revision '
                    'takes 100% traffic')
              # Clear any pinned traffic so the new revision serves 100%.
              # (Manual console edits may have pinned traffic to an old revision.)
              d['spec']['traffic'] = [{'latestRevision': True, 'percent': 100}]
          json.dump(d, open(p, 'w'))
          EOF
          gcloud run services replace "$SVC_JSON" --region="$REGION" --project="$PROJECT"

          # POST-DEPLOY ASSERTION (round 5): read back the traffic allocation
          # and FAIL if the new revision received any traffic. Production
          # traffic must never accidentally follow the latest revision.
          if [ "${STAGED_DEPLOY}" != "false" ]; then
            echo "--- post-deploy traffic assertion ---"
            NEWEST_REV=$(gcloud run revisions list \
              --service workers-collaborative-dashboard \
              --region="$REGION" --project="$PROJECT" \
              --sort-by "~metadata.creationTimestamp" \
              --limit 1 --format "value(metadata.name)")
            export NEWEST_REV
            echo "newest revision: $NEWEST_REV"
            NEWEST_PCT=$(gcloud run services describe workers-collaborative-dashboard \
              --region="$REGION" --project="$PROJECT" --format=json | python3 -c "
          import json,sys,os
          d = json.load(sys.stdin)
          newest = os.environ['NEWEST_REV']
          for t in d.get('status', {}).get('traffic', []) or []:
              if t.get('revisionName') == newest:
                  print(t.get('percent', 0)); break
          else:
              # No named entry: check latestRevision entries (would be a leak).
              for t in d.get('status', {}).get('traffic', []) or []:
                  if t.get('latestRevision'):
                      print(t.get('percent', 0)); break
              else:
                  print(0)
          ")
            echo "traffic on newest revision: ${NEWEST_PCT}%"
            if [ "${NEWEST_PCT}" != "0" ]; then
              echo "::error::STAGED DEPLOY LEAK: newest revision $NEWEST_REV has ${NEWEST_PCT}% traffic (expected 0%). Cutover is BLOCKED — investigate before proceeding."
              exit 1
            fi
            echo "OK: newest revision has 0% traffic."
            # STAGED VERIFICATION via revision TAG (round 6): untagged
            # revisions have no usable direct URL, so tag the staged revision
            # and health-check through the tagged URL. The supported mechanism
            # is `gcloud run services update-traffic --update-tags TAG=REV`
            # (--to-tags requires a traffic percentage, not a revision name).
            # NOTE: flag syntax not verified against a live gcloud in this
            # environment — operator should confirm on first use.
            echo "--- tagging staged revision for verification ---"
            gcloud run services update-traffic workers-collaborative-dashboard \
              --update-tags "stage2-staged=${NEWEST_REV}" \
              --region="$REGION" --project="$PROJECT"
            # ASSERT: the tag targets the expected revision.
            TAG_REV=$(gcloud run services describe workers-collaborative-dashboard \
              --region="$REGION" --project="$PROJECT" \
              --format "value(status.traffic[?tag='stage2-staged'].revisionName)" | head -1)
            if [ "$TAG_REV" != "$NEWEST_REV" ]; then
              echo "::error::tag stage2-staged targets '$TAG_REV', expected '$NEWEST_REV'. Cutover is BLOCKED."
              exit 1
            fi
            echo "OK: tag stage2-staged -> $TAG_REV"
            # ASSERT: production traffic still entirely on the serving revision.
            SVC_HOST=$(gcloud run services describe workers-collaborative-dashboard \
              --region="$REGION" --project="$PROJECT" \
              --format "value(status.url)" | sed 's|^https://||')
            STAGED_TAG_URL="https://stage2-staged---${SVC_HOST}"
            echo "staged revision tagged URL: $STAGED_TAG_URL"
            echo "--- staged health check (via tag) ---"
            STAGED_HEALTH=$(curl -s --max-time 30 "$STAGED_TAG_URL/api/health") || \
              { echo "::error::staged revision health check failed (curl)"; exit 1; }
            echo "$STAGED_HEALTH" | python3 -m json.tool
            echo "$STAGED_HEALTH" | python3 -c "
            import json,sys
            d = json.load(sys.stdin)
            assert d.get('staged') is True, 'health missing staged:true'
            fs = d.get('firestore')
            assert fs in ('connected', 'emulator'), f'firestore not connected: {fs}'
            print('OK: tagged health returns staged:true, firestore:', fs)
            " || { echo "::error::staged health assertion failed"; exit 1; }
          fi
