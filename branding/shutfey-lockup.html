<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Shutfey — brand lockups (D2)</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; display:grid; grid-template-columns:1fr 1fr; }
  figure { margin:0; padding:32px; text-align:center; }
  figcaption { font-size:13px; margin-top:12px; opacity:.65; }
  .day { background:#F8F4ED; color:#30241B; }
  .night { background:#241B12; color:#F3EBDD; }
  img.stacked { width:240px; }
  img.horizontal { width:420px; max-width:100%; }
</style>
</head>
<body>
  <figure class="day">
    <img class="stacked" src="shutfey-lockup-day.png" alt="Shutfey · שותפי — stacked lockup, day">
    <figcaption>Stacked lockup — day</figcaption>
  </figure>
  <figure class="night">
    <img class="stacked" src="shutfey-lockup-night.png" alt="Shutfey · שותפי — stacked lockup, night">
    <figcaption>Stacked lockup — night</figcaption>
  </figure>
  <figure class="day">
    <img class="horizontal" src="shutfey-lockup-h-day.png" alt="Shutfey · שותפי — horizontal lockup, day">
    <figcaption>Horizontal lockup — day</figcaption>
  </figure>
  <figure class="night">
    <img class="horizontal" src="shutfey-lockup-h-night.png" alt="Shutfey · שותפי — horizontal lockup, night">
    <figcaption>Horizontal lockup — night</figcaption>
  </figure>
</body>
</html>
