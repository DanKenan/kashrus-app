name: Read production logs

on:
  workflow_dispatch:
    inputs:
      freshness:
        description: 'How far back to read (e.g. 2h, 30m)'
        required: false
        default: '2h'
      limit:
        description: 'Max log lines'
        required: false
        default: '100'

jobs:
  read-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1080260390009/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@gen-lang-client-0875538181.iam.gserviceaccount.com'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Read Cloud Run logs
        run: |
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="workers-collaborative-dashboard" AND severity>=WARNING' \
            --project gen-lang-client-0875538181 \
            --freshness "${{ inputs.freshness }}" \
            --limit "${{ inputs.limit }}" \
            --format "value(timestamp,severity,textPayload,jsonPayload.message,jsonPayload.error)"
