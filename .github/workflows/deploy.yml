# Auto-deploy: every push to main builds a container with buildpacks
# and deploys it to Cloud Run. No clicks needed — push is the deploy.
name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for keyless (Workload Identity Federation) login
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1080260390009/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@gen-lang-client-0875538181.iam.gserviceaccount.com'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy
        run: |
          set -e
          PROJECT=gen-lang-client-0875538181
          REGION=us-east1
          REPO=cloud-run-source-deploy
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/$REPO/kashrus-app:${GITHUB_SHA}"
          # make sure the Artifact Registry repo exists (idempotent)
          gcloud artifacts repositories describe "$REPO" --location="$REGION" --project="$PROJECT" >/dev/null 2>&1 || \
            gcloud artifacts repositories create "$REPO" --repository-format=docker --location="$REGION" --project="$PROJECT" --description="Built containers for Cloud Run deploys"
          # Carry over the live frontend config so the new bundle behaves identically
          # (VITE_ vars are baked in at build time). Values never leave the runner.
          VITE_ENVS=$(gcloud run services describe workers-collaborative-dashboard --region="$REGION" --project="$PROJECT" --format=json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          envs={e['name']:e.get('value','') for e in d['spec']['template']['spec']['containers'][0].get('env',[]) if e['name'].startswith('VITE_')}
          print(','.join(f'env={k}={v}' for k,v in envs.items()))")
          PACK_ARGS="image=${IMAGE}"
          [ -n "$VITE_ENVS" ] && PACK_ARGS="${PACK_ARGS},${VITE_ENVS}"
          # build with buildpacks, push to Artifact Registry (async: we poll status ourselves)
          BUILD_ID=$(gcloud builds submit --async --pack "$PACK_ARGS" --project="$PROJECT" --format='value(id)' .)
          echo "build id: $BUILD_ID"
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project="$PROJECT" --format='value(status)')
            echo "build status: $STATUS"
            case "$STATUS" in
              SUCCESS) break ;;
              FAILURE|TIMEOUT|CANCELLED|EXPIRED) echo "build failed: $STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          # Deploy by replacing the service spec: this drops the stale AI Studio
          # "run.googleapis.com/sources" annotation that blocks all updates,
          # points at the new image, and ensures production mode — while
          # preserving every other existing setting.
          SVC_JSON=/tmp/svc.json
          gcloud run services describe workers-collaborative-dashboard \
            --region="$REGION" --project="$PROJECT" --format=json > "$SVC_JSON"
          IMAGE="$IMAGE" python3 - "$SVC_JSON" <<'EOF'
          import json, os, sys
          p = sys.argv[1]
          d = json.load(open(p))
          d.pop('status', None)  # replace takes the spec, not observed status
          tpl = d['spec']['template']
          anns = tpl['metadata'].get('annotations', {})
          anns.pop('run.googleapis.com/sources', None)
          c = tpl['spec']['containers'][0]
          c['image'] = os.environ['IMAGE']
          env = c.get('env', [])
          if not any(e['name'] == 'NODE_ENV' for e in env):
              env.append({'name': 'NODE_ENV', 'value': 'production'})
          c['env'] = env
          json.dump(d, open(p, 'w'))
          EOF
          gcloud run services replace "$SVC_JSON" --region="$REGION" --project="$PROJECT"
