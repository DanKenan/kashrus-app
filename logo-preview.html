<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 48px; background: #1c1917; font-family: system-ui, sans-serif; }
  .logo-row { display: flex; align-items: center; gap: 10px; }
  .shield { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #d97706, #b45309, #92400e); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .wordmark { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; color: #faf7f2; white-space: nowrap; }
  .wordmark .gold { color: #d97706; }
  .sub { font-size: 11px; color: #a8a29e; margin-top: 2px; }
  .badge { font-size: 9px; font-weight: 800; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; background: rgba(217,119,6,.15); color: #d97706; border: 1px solid rgba(217,119,6,.4); }
  .light { background: #faf7f2; }
  .light .wordmark { color: #1c1917; }
  .light .sub { color: #78716c; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cap { color: #78716c; font-size: 12px; }
</style>
</head>
<body>
  <div class="col">
    <div class="logo-row">
      <div class="shield">
        <svg viewBox="0 0 40 40" width="48" height="48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 4L7 9V18C7 26.5 12.5 34.5 20 37C27.5 34.5 33 26.5 33 18V9L20 4Z" fill="#92400e" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>
          <circle cx="20" cy="19" r="9" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="2 1.5"/>
          <text x="20" y="25.5" text-anchor="middle" font-size="15" font-weight="900" fill="#ffffff" font-family="serif">ש</text>
        </svg>
      </div>
      <div>
        <div class="wordmark">Shut<span class="gold">fey</span> <span class="badge">PRO</span></div>
        <div class="sub">Compliance &amp; Shift Operations</div>
      </div>
    </div>
    <div class="cap">Dark mode</div>
  </div>
</body>
</html>
