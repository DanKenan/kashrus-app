name: Read production logs

on:
  workflow_dispatch:
    inputs:
      freshness:
        description: 'How far back to read (e.g. 2h, 30m)'
        required: false
        default: '2h'
      limit:
        description: 'Max log lines'
        required: false
        default: '100'

jobs:
  read-logs:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1080260390009/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@gen-lang-client-0875538181.iam.gserviceaccount.com'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Read Cloud Run logs
        run: |
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="workers-collaborative-dashboard" AND timestamp>="2026-10-18T16:15:00Z" AND timestamp<="2026-10-18T16:25:00Z"' \
            --project gen-lang-client-0875538181 \
            --limit 50 \
            --format json > /tmp/logs.json
          python3 -c "
          import json
          logs = json.load(open('/tmp/logs.json'))
          for l in logs:
              ts = l.get('timestamp', '')
              sev = l.get('severity', '')
              jp = l.get('jsonPayload', {})
              tp = l.get('textPayload', '')
              msg = jp.get('message', '') or tp or str(jp)[:500]
              err = jp.get('error', '')
              print(f'{ts} [{sev}] {msg}')
              if err: print(f'  ERROR DETAIL: {err}')
          "
