<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Name Preview</title>
<style>
  :root { --gold: #d97706; --gold-deep: #b45309; --gold-ink: #92400e; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #1c1917; color: #f5f0e8; margin: 0; padding: 24px 16px; }
  h1 { font-size: 18px; text-align: center; margin-bottom: 6px; }
  p.sub { text-align: center; color: #a8a29e; font-size: 13px; margin-top: 0; margin-bottom: 28px; }
  .option { background: #292524; border: 2px solid #44403c; border-radius: 20px; padding: 28px 20px; margin-bottom: 20px; text-align: center; }
  .option .label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #a8a29e; margin-bottom: 18px; }
  .logo-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .shield { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, var(--gold), var(--gold-deep) 60%, var(--gold-ink)); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .name { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
  .name .accent { color: var(--gold); }
  .tagline { margin-top: 14px; font-size: 12px; color: #a8a29e; }
</style>
</head>
<body>
  <h1>Pick your app's name</h1>
  <p class="sub">How each one looks in the header — tap your pick in chat</p>

  <div class="option">
    <div class="label">Option A</div>
    <div class="logo-row">
      <div class="shield">נ</div>
      <div class="name"><span class="accent">נטורי</span></div>
    </div>
    <div class="tagline">From נטורי קרתא — the guardians</div>
  </div>

  <div class="option">
    <div class="label">Option B</div>
    <div class="logo-row">
      <div class="shield">ש</div>
      <div class="name">Shut<span class="accent">fey</span></div>
    </div>
    <div class="tagline">From קדירה דבי שותפיה — the partners' pot</div>
  </div>
</body>
</html>
